<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود ربات مدیریت گروه</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); padding: 20px;
        }
        .card {
            background: #fff; padding: 40px 30px; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25); text-align: center;
            max-width: 440px; width: 100%;
        }
        .icon { font-size: 64px; margin-bottom: 15px; }
        h1 { font-size: 22px; color: #222; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.8; }
        .features {
            text-align: right; background: #f7f9fc; border-radius: 12px;
            padding: 15px 20px; margin-bottom: 25px; font-size: 13px;
            color: #444; line-height: 2;
        }
        .features b { color: #11998e; }
        .download-btn {
            display: inline-block; background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff; text-decoration: none; padding: 14px 40px;
            border-radius: 12px; font-size: 16px; font-weight: bold;
            transition: all 0.3s ease; box-shadow: 0 6px 15px rgba(17, 153, 142, 0.4);
        }
        .download-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(17, 153, 142, 0.55); }
        .download-btn:active { transform: translateY(0); }
        .file-name { margin-top: 18px; font-size: 12px; color: #999; direction: ltr; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🛡️</div>
        <h1>ربات مدیریت گروه روبیکا</h1>
        <p>سورس کامل ربات مدیریت گروه، آماده اجرا و توسعه.</p>

        <div class="features">
            ✅ <b>اخراج</b> و <b>مسدودسازی</b> کاربر<br>
            ✅ <b>سکوت</b> و <b>رفع سکوت</b> خودکار<br>
            ✅ <b>قفل لینک</b> و <b>قفل فوروارد</b><br>
            ✅ بررسی خودکار ادمین‌ها
        </div>

        <!-- ⬇️ فقط اسم فایل اینجا تغییر کرد -->
        <a href="bot.py" download="bot.py" class="download-btn">
            ⬇️ دانلود فایل
        </a>

        <div class="file-name">bot.py</div>
    </div>
</body>
</html>
